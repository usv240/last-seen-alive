<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Last Seen Alive">
  <!-- A single film frame with its perforations, and one lit sprocket:
       the fragment, and the one clue in it that is still legible. -->
  <rect width="32" height="32" rx="4" fill="#16130e"/>
  <rect x="8" y="6" width="16" height="20" rx="1.5" fill="#f6f4ef"/>
  <g fill="#16130e">
    <rect x="10" y="8.5" width="2.6" height="2.6" rx=".6"/>
    <rect x="10" y="14.7" width="2.6" height="2.6" rx=".6"/>
    <rect x="10" y="20.9" width="2.6" height="2.6" rx=".6"/>
    <rect x="19.4" y="8.5" width="2.6" height="2.6" rx=".6"/>
    <rect x="19.4" y="20.9" width="2.6" height="2.6" rx=".6"/>
  </g>
  <rect x="19.4" y="14.7" width="2.6" height="2.6" rx=".6" fill="#2b3f8f"/>
</svg>
