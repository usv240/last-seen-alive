name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.resolved.txt
      - run: pip install pytest==9.1.1 pytest-asyncio==1.3.0 ruff==0.15.6
      - run: ruff check .
      - run: pytest -q
