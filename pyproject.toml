[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "last-seen-alive"
version = "0.1.0"
description = "Evidence-first identification triage for unidentified archival film fragments."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "fastapi>=0.141,<1",
  "google-adk[gcp]>=2.7,<3",
  "google-genai>=2.12,<3",
  "httpx>=0.28,<1",
  "parallel-web>=1.1,<2",
  "pydantic>=2.12,<3",
  "python-multipart>=0.0.22,<1",
  "uvicorn[standard]>=0.41,<1",
]

[project.optional-dependencies]
dev = ["pytest>=9.1,<10", "pytest-asyncio>=1.3,<2", "ruff>=0.15,<1"]

[tool.hatch.build.targets.wheel]
packages = ["agentic_core", "app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

