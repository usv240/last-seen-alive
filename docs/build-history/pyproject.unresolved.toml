[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "last-seen-alive"
version = "0.1.0"
description = "Evidence-first identification triage for unidentified archival film fragments."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "fastapi>=0.116,<1",
  "google-adk[gcp]>=2.0,<3",
  "google-cloud-aiplatform[agent_engines,adk]>=1.112,<3",
  "google-genai>=1.0,<2",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["agentic_core", "app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

